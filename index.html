<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Siber Laboratuvar - 2D Multiplayer</title>
    <!-- Firebase ve Phaser.js Oyun Motoru Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #game-container { width: 100vw; height: 100vh; display: block; }
        #login-screen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(22, 27, 34, 0.95); padding: 25px; border-radius: 12px; border: 2px solid #30363d; text-align: center; color: white; z-index: 10; width: 85%; max-width: 350px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #30363d; font-size: 16px; box-sizing: border-box; }
        input { background: #21262d; color: white; }
        button { background: #238636; color: white; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <h3 style="margin-top:0;">🧬 Siber Laboratuvar</h3>
    <input type="text" id="room-input" placeholder="Oda Kodu (Örn: 99)">
    <input type="text" id="name-input" placeholder="Adınız...">
    <button onclick="startGame()">Oyuna Gir</button>
</div>

<div id="game-container"></div>

<script>
    // Firebase Bağlantı Ayarları
    const firebaseConfig = {
        authDomain: "vampir-koylu-1feeb.firebaseapp.com",
        databaseURL: "https://vampir-koylu-1feeb-default-rtdb.firebaseio.com",
        projectId: "vampir-koylu-1feeb",
        storageBucket: "vampir-koylu-1feeb.appspot.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let game, currentRoom, myPlayerId, roomRef;
    let myPlayerName = "";
    let localPlayer = null;
    let remotePlayers = {};
    let joystickData = { x: 0, y: 0, active: false };

    // Phaser 2D Oyun Motoru Ayarları
    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: window.innerWidth,
        height: window.innerHeight,
        physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
        scene: { preload: preload, create: create, update: update }
    };

    function startGame() {
        const room = document.getElementById('room-input').value.trim();
        const name = document.getElementById('name-input').value.trim();
        if (!room || !name) { alert("Lütfen alanları doldurun!"); return; }

        currentRoom = room;
        myPlayerName = name;
        roomRef = db.ref('rooms/' + currentRoom);

        document.getElementById('login-screen').style.display = 'none';
        
        // Phaser oyun motorunu başlat
        game = new Phaser.Game(config);
    }

    function preload() {
        // Telefon ekranında çizeceğimiz basit harita karelerini ve karakter renklerini burada oluşturuyoruz
        let canvas = this.textures.createCanvas('floor', 64, 64);
        let ctx = canvas.context;
        ctx.fillStyle = '#1f2937'; ctx.fillRect(0, 0, 64, 64);
        ctx.strokeStyle = '#374151'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, 64, 64);
        canvas.refresh();
    }

    function create() {
        let scene = this;

        // 1. Zemin Izgarası (Harita Temsili)
        for (let x = -1000; x < 2000; x += 64) {
            for (let y = -1000; y < 2000; y += 64) {
                scene.add.image(x, y, 'floor').setOrigin(0);
            }
        }

        // 2. Firebase'e Kendimizi Kaydetme
        const newPlayerRef = roomRef.child('players').push();
        myPlayerId = newPlayerRef.key;
        
        // Rastgele bir başlangıç pozisyonu verelim
        let startX = 400 + Math.random() * 100;
        let startY = 300 + Math.random() * 100;

        newPlayerRef.set({ name: myPlayerName, x: startX, y: startY });
        // Sekme kapatılırsa oyuncuyu otomatik sil
        newPlayerRef.onDisconnect().remove();

        // 3. Kendi Karakterimizi Ekrana Çizme (Mavi Yuvarlak)
        localPlayer = scene.add.circle(startX, startY, 20, 0x00a8ff);
        scene.physics.add.existing(localPlayer);
        localPlayer.body.setCollideWorldBounds(false);

        // İsmini kafasının üstüne yazalım
        localPlayer.nameText = scene.add.text(startX, startY - 35, myPlayerName, { fontSize: '14px', fill: '#fff' }).setOrigin(0.5);

        // Kamerayı kendimize sabitleyelim
        scene.cameras.main.startFollow(localPlayer);

        // 4. Diğer Oyuncuları Canlı Takip Etme
        roomRef.child('players').on('child_added', (snapshot) => {
            if (snapshot.key === myPlayerId) return;
            let data = snapshot.val();
            
            // Diğer oyuncuları Yeşil Yuvarlak yapalım
            let p = scene.add.circle(data.x, data.y, 20, 0x4cd137);
            p.nameText = scene.add.text(data.x, data.y - 35, data.name, { fontSize: '14px', fill: '#fff' }).setOrigin(0.5);
            
            remotePlayers[snapshot.key] = p;
        });

        roomRef.child('players').on('child_changed', (snapshot) => {
            if (snapshot.key === myPlayerId) return;
            let data = snapshot.val();
            if (remotePlayers[snapshot.key]) {
                // Diğer oyuncunun yeni konumunu ekranda güncelle
                remotePlayers[snapshot.key].x = data.x;
                remotePlayers[snapshot.key].y = data.y;
                remotePlayers[snapshot.key].nameText.x = data.x;
                remotePlayers[snapshot.key].nameText.y = data.y - 35;
            }
        });

        roomRef.child('players').on('child_removed', (snapshot) => {
            if (remotePlayers[snapshot.key]) {
                remotePlayers[snapshot.key].nameText.destroy();
                remotePlayers[snapshot.key].destroy();
                delete remotePlayers[snapshot.key];
            }
        });

        // 5. Mobil Sanal Joystick Kapsama Alanı
        let joyBase = scene.add.circle(100, window.innerHeight - 100, 60, 0xffffff, 0.2).setScrollFactor(0).setDepth(100);
        let joyThumb = scene.add.circle(100, window.innerHeight - 100, 30, 0xffffff, 0.5).setScrollFactor(0).setDepth(101);

        scene.input.on('pointerdown', (pointer) => {
            if (pointer.x < window.innerWidth / 2 && pointer.y > window.innerHeight / 2) {
                joystickData.active = true;
                joyBase.x = pointer.x; joyBase.y = pointer.y;
                joyThumb.x = pointer.x; joyThumb.y = pointer.y;
            }
        });

        scene.input.on('pointermove', (pointer) => {
            if (!joystickData.active) return;
            let dist = Phaser.Math.Distance.Between(joyBase.x, joyBase.y, pointer.x, pointer.y);
            let angle = Phaser.Math.Angle.Between(joyBase.x, joyBase.y, pointer.x, pointer.y);
            let maxDist = 50;

            if (dist > maxDist) dist = maxDist;
            joyThumb.x = joyBase.x + Math.cos(angle) * dist;
            joyThumb.y = joyBase.y + Math.sin(angle) * dist;

            joystickData.x = Math.cos(angle) * (dist / maxDist);
            joystickData.y = Math.sin(angle) * (dist / maxDist);
        });

        scene.input.on('pointerup', () => {
            joystickData.active = false;
            joystickData.x = 0; joystickData.y = 0;
            joyBase.x = 100; joyBase.y = window.innerHeight - 100;
            joyThumb.x = 100; joyThumb.y = window.innerHeight - 100;
        });
    }

    function update() {
        if (!localPlayer || !localPlayer.body) return;

        // Oyuncu hızı
        let speed = 200;
        localPlayer.body.setVelocityX(joystickData.x * speed);
        localPlayer.body.setVelocityY(joystickData.y * speed);
        
        localPlayer.nameText.x = localPlayer.x;
        localPlayer.nameText.y = localPlayer.y - 35;

        // Pozisyonumuz değiştiyse Firebase'e gönder (Saliselik güncelleme)
        if (joystickData.active) {
            db.ref('rooms/' + currentRoom + '/players/' + myPlayerId).update({
                x: localPlayer.x,
                y: localPlayer.y
            });
        }
    }
</script>
</body>
</html>
