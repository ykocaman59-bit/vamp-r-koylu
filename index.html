<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber Laboratuvar - Vampir Köylü</title>
    <!-- Firebase Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 15px; margin: 0; }
        .box { max-width: 450px; margin: 20px auto; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #30363d; font-size: 16px; box-sizing: border-box; }
        input { background: #21262d; color: white; }
        button { background: #238636; color: white; cursor: pointer; font-weight: bold; border: none; }
        button:hover { background: #2ea043; }
        .player-tag { display: inline-block; background: #21262d; padding: 8px 12px; margin: 5px; border-radius: 20px; border: 1px solid #30363d; font-size: 14px; }
        .hidden { display: none; }
        .role-alert { padding: 20px; border-radius: 8px; font-size: 26px; font-weight: bold; margin: 25px 0; text-transform: uppercase; letter-spacing: 2px; }
        .vampire { background: #3c1212; color: #ff6b6b; border: 2px solid #f85149; box-shadow: 0 0 15px rgba(248,81,73,0.3); }
        .villager { background: #123c1c; color: #56d364; border: 2px solid #3ec95b; box-shadow: 0 0 15px rgba(62,201,91,0.3); }
        ul { text-align: left; background: #0d1117; padding: 15px 15px 15px 35px; border-radius: 8px; border: 1px solid #30363d; }
        li { margin: 12px 0; font-size: 15px; color: #e6edf3; }
    </style>
</head>
<body>

<div class="box">
    <h2>🧬 SİBER LABORATUVAR</h2>
    <p style="color: #8b949e; font-size: 14px;">Her oyuncu kendi telefonundan bağlanır. Roller ve görevler gizlice dağıtılır.</p>
    <hr style="border-color: #30363d; margin: 20px 0;">

    <!-- ODA GİRİŞ EKRANI -->
    <div id="lobby-screen">
        <input type="text" id="room-input" placeholder="Oda Kodu Yazın (Örn: 555)">
        <input type="text" id="name-input" placeholder="Adınızı Yazın...">
        <button onclick="joinRoom()">Odaya Katıl</button>
    </div>

    <!-- ODA BEKLEME EKRANI -->
    <div id="waiting-screen" class="hidden">
        <h3>Oda: <span id="room-id-text" style="color: #58a6ff;">-</span></h3>
        <p style="color: #8b949e;">Katılan Siber Kimlikler (<span id="player-count">0</span>):</p>
        <div id="player-list"></div>
        <button id="start-btn" onclick="distributeRoles()" style="background: #1f6feb; margin-top: 25px;">Oyunu Başlat (Rolleri Dağıt)</button>
    </div>

    <!-- OYUN VE ROL GÖSTERİM EKRANI -->
    <div id="game-screen" class="hidden">
        <div id="role-box" class="role-alert"></div>
        <h3>📋 Atanan Görevlerin:</h3>
        <ul id="tasks-list"></ul>
        <p style="color: #8b949e; font-size: 13px; margin-top: 25px;">💡 Görevlerini tamamla, vampiri bul veya sızdığın laboratuvarı sabote et!</p>
        <button onclick="leaveRoom()" style="background: #21262d; border: 1px solid #30363d; margin-top: 20px;">Odadan Çık / Yeni Oyun</button>
    </div>
</div>

<script>
    // Sizin ekran görüntünüzdeki veritabanı linkine göre otomatik oluşturulan bağlantı ayarları
    const firebaseConfig = {
        apiKey: "AIzaSyBl" + "An_DummyKeyForSecurity_To_Be_Replaced_If_Needed", 
        authDomain: "vampir-koylu-1feeb.firebaseapp.com",
        databaseURL: "https://vampir-koylu-1feeb-default-rtdb.firebaseio.com",
        projectId: "vampir-koylu-1feeb",
        storageBucket: "vampir-koylu-1feeb.appspot.com"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = "";
    let myPlayerId = "";
    let roomRef = null;

    const KÖYLÜ_GÖREVLERİ = [
        "Ana bilgisayara siber virüs taraması yap",
        "Kafeteryadaki hidrolik kolları kalibre et",
        "Biyoloji laboratuvarındaki tüpleri sterilize et",
        "Reaktör odasındaki plazma sızıntısını temizle",
        "Güvenlik kameralarının veri akışını senkronize et"
    ];

    const VAMPİR_GÖREVLERİ = [
        "Havalandırma kapaklarının vidalarını gevşet",
        "Oksijen üretim ünitesine sahte yazılım yükle",
        "Ana güç trafosuna kısa devre yaptır"
    ];

    function joinRoom() {
        const room = document.getElementById('room-input').value.trim();
        const name = document.getElementById('name-input').value.trim();

        if (!room || !name) {
            alert("Lütfen tüm alanları doldurun!");
            return;
        }

        currentRoom = room;
        roomRef = db.ref('rooms/' + currentRoom);

        // Oyuncu kaydı oluştur
        const newPlayerRef = roomRef.child('players').push();
        myPlayerId = newPlayerRef.key;

        newPlayerRef.set({
            name: name,
            role: "Bekleniyor...",
            tasks: ["Oyun başladığında yüklenecek..."]
        });

        // Sayfa geçişleri
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('waiting-screen').classList.remove('hidden');
        document.getElementById('room-id-text').innerText = currentRoom;

        // Canlı Oyuncu Listesi Takibi
        roomRef.child('players').on('value', (snapshot) => {
            const players = snapshot.val();
            const listDiv = document.getElementById('player-list');
            listDiv.innerHTML = "";
            let count = 0;

            if (players) {
                Object.keys(players).forEach(key => {
                    count++;
                    let p = players[key];
                    listDiv.innerHTML += `<span class="player-tag">🤖 ${p.name}</span>`;
                });
            }
            document.getElementById('player-count').innerText = count;
        });

        // Canlı Oyun Başlama Kontrolü (Diğer oyuncular için otomatik tetiklenir)
        roomRef.child('status').on('value', (snapshot) => {
            if (snapshot.val() === 'started') {
                loadGameScreen();
            }
        });
    }

    function distributeRoles() {
        roomRef.child('players').once('value', (snapshot) => {
            const players = snapshot.val();
            if (!players || Object.keys(players).length < 2) {
                alert("Oyunu başlatmak için en az 2 oyuncu olmalıdır!");
                return;
            }

            const keys = Object.keys(players);
            // Rastgele 1 kişiyi siber vampir seç
            const randomVampireKey = keys[Math.floor(Math.random() * keys.length)];

            keys.forEach(key => {
                let assignedRole = "Siber Köylü";
                let assignedTasks = [...KÖYLÜ_GÖREVLERİ].sort(() => 0.5 - Math.random()).slice(0, 3);

                if (key === randomVampireKey) {
                    assignedRole = "Siber Vampir";
                    assignedTasks = [...VAMPİR_GÖREVLERİ].sort(() => 0.5 - Math.random()).slice(0, 2);
                }

                roomRef.child('players/' + key).update({
                    role: assignedRole,
                    tasks: assignedTasks
                });
            });

            // Oyun durumunu başlatıldı yap
            roomRef.update({ status: 'started' });
        });
    }

    function loadGameScreen() {
        roomRef.child('players/' + myPlayerId).once('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            const roleBox = document.getElementById('role-box');
            roleBox.innerText = data.role;
            roleBox.className = "role-alert " + (data.role === "Siber Vampir" ? "vampire" : "villager");

            const tasksList = document.getElementById('tasks-list');
            tasksList.innerHTML = "";
            data.tasks.forEach(task => {
                tasksList.innerHTML += `<li>🔲 ${task}</li>`;
            });
        });
    }

    function leaveRoom() {
        if (roomRef && myPlayerId) {
            roomRef.child('players/' + myPlayerId).remove();
        }
        location.reload();
    }
</script>
</body>
</html>
